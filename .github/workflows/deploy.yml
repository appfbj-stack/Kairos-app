name: Deploy to VPS

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 187.77.229.227
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /etc/dokploy/compose/kairos-sede-sorocaba
            git stash
            git pull origin main
            git stash pop || true
            docker compose up -d --build
