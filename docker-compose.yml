services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    entrypoint: ["uvicorn"]
    command: ["app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      DATABASE_URL: postgresql://kairos:${POSTGRES_PASSWORD}@sede-sorocaba-postgres-1:5432/kairos
      DATABASE_SCHEMA: kairos_sede
      SECRET_KEY: ${SECRET_KEY}
      KAIROS_ADMIN_URL: http://backend:3010
      KAIROS_ADMIN_BASIC_USER: admin
      KAIROS_ADMIN_BASIC_PASSWORD: ${KAIROS_ADMIN_BASIC_PASSWORD}
      KAIROS_CLIENT_ID: ${KAIROS_CLIENT_ID}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI}
      FRONTEND_URL: ${FRONTEND_URL}
      OPENROUTER_BASE_URL: https://openrouter.ai/api/v1
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      OPENROUTER_MODEL: qwen/qwen-2.5-72b-instruct
      LGPD_VERSAO_TERMO: ${LGPD_VERSAO_TERMO}
      LGPD_DPO_EMAIL: ${LGPD_DPO_EMAIL}
      LGPD_RETENCAO_MESES: ${LGPD_RETENCAO_MESES}
      LGPD_CONTROLADORA_NOME: ${LGPD_CONTROLADORA_NOME}
      LGPD_CONTROLADORA_CNPJ: ${LGPD_CONTROLADORA_CNPJ}
      LGPD_CONTROLADORA_ENDERECO: ${LGPD_CONTROLADORA_ENDERECO}
    volumes:
      - uploads_data:/app/uploads
    ports:
      - "8012:8000"
    networks:
      kairos_network:
        aliases:
          - sede-backend

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3022:80"
    networks:
      - kairos_network

volumes:
  uploads_data:

networks:
  kairos_network:
    external: true
