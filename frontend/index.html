<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="192x192" href="/icons/icon-192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1e40af" />
    <title>Kairos Base</title>
    <script>
      console.log('KAIROS-APP-V2');
      if ('serviceWorker' in navigator) {
        (async function() {
          var regs = await navigator.serviceWorker.getRegistrations();
          var hadSw = regs.length > 0;
          regs.forEach(function(reg) { reg.unregister(); });
          if (caches) {
            var nomes = await caches.keys();
            await Promise.all(nomes.map(function(n) { return caches.delete(n); }));
          }
          if (hadSw && !sessionStorage.getItem('kairos_clean')) {
            sessionStorage.setItem('kairos_clean', '1');
            window.location.reload();
          }
        })();
      }
    </script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
  </head>
  <body>
    <div id="root"></div>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
